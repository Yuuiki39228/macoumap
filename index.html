toggleBtn.onclick = function(){

  if(isCollapsed){
    sideBox.classList.add("collapsed");
    mainBox.classList.add("collapsed-map");
    toggleBtn.innerText = "▲ 展开地点列表";
  }else{

window.openPreview = function(placeId, imgIndex){
  const place = placeData.find(p=>p.id === placeId);
  previewImgList = [...place.images];
  previewCurIndex = imgIndex;
  previewImgDom.src = previewImgList[previewCurIndex];
  fullPreviewDom.style.display = 'flex';
}
window.closePreview = function(e){
  if(e && (e.target.tagName === 'IMG' || e.target.tagName === 'BUTTON')) return;
  fullPreviewDom.style.display = 'none';
}
window.previewPrev = function(){
  previewCurIndex--;
  if(previewCurIndex < 0) previewCurIndex = previewImgList.length -1;
  previewImgDom.src = previewImgList[previewCurIndex];
}
window.previewNext = function(){
  previewCurIndex++;
  if(previewCurIndex >= previewImgList.length) previewCurIndex = 0;
  previewImgDom.src = previewImgList[previewCurIndex];
}
document.querySelector('.preview-close').onclick = closePreview;
function getCheckinList(){
  const raw = localStorage.getItem("checkin_records");
  if(!raw) return [];
  try{
    return JSON.parse(raw);
  }catch(e){
    return [];
  }
}

  const arr = getCheckinList();
  return arr.some(item=>item.placeId === placeId);
}
window.doCheckin = function(placeId){
  if(isPlaceChecked(placeId)) return;
  const place = placeData.find(p=>p.id === placeId);
  if(!place) return;
  const {lng,lat} = parseCoords(place.coords);
  const rec = {
    placeId:place.id,
    placeName:place.name,
    markerIcon:place.markerIcon,
    lng:lng,
    lat:lat,
    time:new Date().toLocaleString()
  };
  const list = getCheckinList();
  list.push(rec);
  localStorage.setItem("checkin_records", JSON.stringify(list));
  applyMarkerGrayStatus();
  if(currentPlace && currentPlace.id === placeId){
    openPopup(currentPlace);
  }
}
function applyMarkerGrayStatus(){
  const checkedIds = getCheckinList().map(r=>r.placeId);
  markerList.forEach(m=>{
    const pid = m.extData.id;
    const dom = m.getContent();
    if(checkedIds.includes(pid)){
      dom.classList.add('marker-checked');
    }else{
      dom.classList.remove('marker-checked');
    }
  })
}
window.openCheckinModal = function(){
  document.getElementById("checkinModal").style.display = "block";
  renderCheckinList();
}
window.closeCheckinModal = function(){
  document.getElementById("checkinModal").style.display = "none";
}
function renderCheckinList(){
  const list = getCheckinList();
  const wrap = document.getElementById("checkinListWrap");
  const genBtn = document.getElementById('genPosterBtn');
  if(list.length === 0){
    wrap.innerHTML = `<div class="checkin-empty">暂无打卡记录，前往地图进行打卡</div>`;
    if(genBtn) genBtn.disabled = true;
    return;
  }
  let html = "";
  list.forEach(r=>{
    const iconSrc = r.markerIcon || '';
    html += `
    <div class="checkin-item">
      <img class="checkin-item-icon" src="${iconSrc}" alt="地点图标" onerror="this.style.visibility='hidden'">
      <div class="checkin-item-name">${r.placeName}</div>
      <div class="checkin-item-time">打卡时间：${r.time}</div>
    </div>
    `;
  });
  wrap.innerHTML = html;
  if(genBtn) genBtn.disabled = false;
}
function loadHtml2Canvas() {
  return new Promise(function (resolve, reject) {
    if (window.html2canvas) {
      resolve();
      return;
    }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}
function getImgRatio(src) {
  return new Promise(resolve => {
    const im = new Image();
    im.onload = () => resolve(im.naturalHeight / im.naturalWidth);
    im.onerror = () => resolve(0);
    im.src = src;
  });
}
async function buildPosterDom(list, W) {
  const k = W / 520;
  const px = v => Math.round(v * k) + 'px';
  const [topRatio, botRatio] = await Promise.all([
    getImgRatio("./images/bg-top.png"),
    getImgRatio("./images/bg-bottom.png")
  ]);
  const headerH = topRatio ? Math.round(W * topRatio) : Math.round(70 * k);
  const footerH = botRatio ? Math.round(W * botRatio) : Math.round(60 * k);
  const wrap = document.createElement('div');
  wrap.style.cssText = `position:absolute;left:-10000px;top:0;width:${W}px;box-sizing:border-box;`;
  const header = document.createElement('div');
  header.style.cssText = `height:${headerH}px;background:url("./images/bg-top.png") no-repeat center/100% 100%;border-radius:${px(20)} ${px(20)} 0 0;`;
  const middle = document.createElement('div');
  middle.style.cssText = `background:url("./images/bg-middle.png") repeat-y center top/${W}px auto;padding:${px(10)} ${px(22)};box-sizing:border-box;`;
  list.forEach(r => {
    const item = document.createElement('div');
    item.style.cssText = `position:relative;padding:${px(16)} ${px(12)} ${px(16)} ${px(44)};border-bottom:1px solid #ffdde8;`;
    item.innerHTML = `
      <img src="${r.markerIcon}" style="position:absolute;left:${px(4)};top:50%;transform:translateY(-50%);width:${px(28)};height:${px(28)};object-fit:contain;" onerror="this.style.visibility='hidden'">
      <div style="font-weight:600;font-size:${px(16)};color:#8c4859;margin-bottom:${px(6)};">${r.placeName}</div>
      <div style="font-size:${px(13)};color:#b8788a;">打卡时间：${r.time}</div>`;
    middle.appendChild(item);
  });
  const footer = document.createElement('div');
  footer.style.cssText = `height:${footerH}px;background:url("./images/bg-bottom.png") no-repeat center/100% 100%;`;
  wrap.appendChild(header);
  wrap.appendChild(middle);
  wrap.appendChild(footer);
  document.body.appendChild(wrap);
  return wrap;
}
window.openPosterPreview = async function () {
  const list = getCheckinList();
  if (list.length <= 0) return;
  try {
    if (!window.html2canvas) await loadHtml2Canvas();
    const W = 1080;
    const dom = await buildPosterDom(list, W);
    await new Promise(r => setTimeout(r, 400));
    const canvas = await html2canvas(dom, {
      backgroundColor: null,
      scale: 1,
      width: W,
      height: dom.offsetHeight,
      allowTaint: true,
      useCORS: true,
      logging: false
    });
    document.body.removeChild(dom);
    canvas.toBlob(function (blob) {
      if (!blob) return;
      if (posterBlobUrl) URL.revokeObjectURL(posterBlobUrl);
      posterBlobUrl = URL.createObjectURL(blob);
      posterImgEl.src = posterBlobUrl;
      posterModal.style.display = 'flex';
    }, 'image/png');
  } catch (err) {
    console.error(err);
    alert('海报生成失败，请使用 http 本地服务运行。');
  }
};
window.closePosterPreview = function () {
  posterModal.style.display = 'none';
};
window.downloadPoster = function () {
  if (!posterBlobUrl) return;
  const a = document.createElement('a');
  a.href = posterBlobUrl;
  a.download = '咲良澳门打卡海报.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
};
function initMap(){
  const mapDom = document.getElementById('map');
  if (mapDom) {
    mapDom.style.width = '100%';
    mapDom.style.height = '100%';
    mapDom.style.minHeight = '300px';
  }
  map = new AMap.Map("map", {
    zoom:13,
    center:[113.561538,22.14043],
    resizeEnable:true
  });
  geo = new AMap.Geolocation({
    enableHighAccuracy:true,
    timeout:10000,
    buttonPosition:"RB",
    showCircle: false,
    showMarker: true
  });
  map.addControl(geo);
  geo.on("complete", function(res){
    if(res.marker) res.marker.remove();
    setTimeout(()=>{
      if(res.circle) res.circle.remove();
    }, 120);
    if(res.position){
      userLngLat = res.position;
      refreshAllDistance();
    }
  });
  map.on("click",()=>closePopup());
  map.on("moveend", ()=>{
    if(currentPlace){
      updatePopupPosition(currentPlace);
    }
  });
  window.addEventListener('resize',()=>{
    map.resize();
    if(currentPlace) updatePopupPosition(currentPlace);
  })
  renderPlaces();
  geo.getCurrentPosition((status, res)=>{
    if(status === 'complete' && res && res.position){
      userLngLat = res.position;
      refreshAllDistance();
    }else{
      AMap.plugin('AMap.CitySearch', function(){
        var citySearch = new AMap.CitySearch();
        citySearch.getLocalCity(function(s, r){
          if(s === 'complete' && r && r.bounds){
            userLngLat = r.bounds.getCenter();
            refreshAllDistance();
          }
        });
      });
    }
  });
  map.on("complete",()=>{
    applyMarkerGrayStatus();
  })
}
function parseCoords(str){
  const arr = str.split(",");
  return {
    lng: parseFloat(arr[0]),
    lat: parseFloat(arr[1])
  }
}
function renderPlaces(){
  const listWrap = document.getElementById("placeList");
  listWrap.innerHTML = "";
  markerList.length = 0;
  placeData.forEach((place)=>{
    const {lng,lat} = parseCoords(place.coords);
    const pos = new AMap.LngLat(lng, lat);
    const contentDom = document.createElement('div');
    contentDom.className = "marker-wrap";
    contentDom.innerHTML = `<img src="${place.markerIcon}" alt="">`;
    const marker = new AMap.Marker({
      position:pos,
      map:map,
      title:place.name,
      content: contentDom,
      offset: new AMap.Pixel(-16, -33)
    });
    marker.extData = {...place};
    markerList.push(marker);
    marker.on("click",()=>{
      openPopup(place);
      setActiveItem(place.id);
    })
    const div = document.createElement("div");
    div.className = "item";
    div.dataset.id = place.id;
    div.innerHTML = `
      <div class="name">${place.name}</div>
      <div class="addr">${place.address}</div>
      <div class="dist" data-id="${place.id}">距离：--</div>
    `
    div.onclick = ()=>{
      const pos = new AMap.LngLat(parseFloat(place.coords.split(',')[0]),parseFloat(place.coords.split(',')[1]));
      map.setCenter(pos,true);
      map.setZoom(14);
      openPopup(place);
      setActiveItem(place.id);
    }
    listWrap.appendChild(div);
  })
}
function updatePopupPosition(place){
  const {lng,lat} = parseCoords(place.coords);
  const lnglat = new AMap.LngLat(lng, lat);
  const pixel = map.lngLatToContainer(lnglat);
  const mapDom = document.getElementById("map");
  const mapRect = mapDom.getBoundingClientRect();
  const popupWidth = popupDom.offsetWidth;
  const popupHeight = popupDom.offsetHeight;
  let left = pixel.getX() + 18;
  let top = pixel.getY() + 24;
  if(left + popupWidth > mapRect.width - 10){
    left = pixel.getX() - popupWidth - 18;
  }
  if(top + popupHeight > mapRect.height - 10){
    top = pixel.getY() - popupHeight - 18;
  }
  if(left < 10) left = 10;
  if(top < 10) top = 10;
  popupDom.style.left = left + "px";
  popupDom.style.top = top + "px";
}
function openPopup(place){
  currentPlace = place;
  const {lng,lat} = parseCoords(place.coords);
  const navUrl = `https://uri.amap.com/navigation?from=${userLngLat ? userLngLat.lng+','+userLngLat.lat:''}&to=${lng},${lat},${place.name}&mode=car&callnative=1&coordinate=gaode&src=myweb`
  let imgHtml = '';
  if(place.images && place.images.length>0){
    const imgList = place.images;
    let imgItems = imgList.map((src,i)=>`
        <img class="img-${place.id}-item" data-idx="${i}" onclick="openPreview(${place.id},${i})" src="${src}" alt="" onerror="this.src='https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/default_img.png';this.classList.add('show')">
    `).join("");
    let dots = imgList.map((_,i)=>
        `<span class="dot ${i===0?'active':''}" onclick="jumpImg(${place.id},${i})"></span>`
    ).join("");
    imgHtml = `
    <div class="img-wrap" id="wrap-${place.id}">
        ${imgList.length>1 ? `
            <button class="slide-btn prev" onclick="slideImg(${place.id},-1)">‹</button>
            <button class="slide-btn next" onclick="slideImg(${place.id},1)">›</button>
        `:""}
        ${imgItems}
    </div>
    <div class="img-dot">${dots}</div>
    `
  }
  const checked = isPlaceChecked(place.id);
  const checkBtnHtml = checked
    ? `<button class="nav-btn btn-checked" disabled>✅已打卡</button>`
    : `<button class="nav-btn" onclick="doCheckin(${place.id})">📌打卡</button>`;
  const bodyHtml = `
      ${imgHtml}
      <h4>${place.name}</h4>
      <p>${place.address}</p>
      <p>${place.desc}</p>
      <div class="pop-row-two">
        <a class="nav-btn" href="${navUrl}" target="_blank">🔜 到这去</a>
        ${checkBtnHtml}
      </div>
  `;
  document.getElementById("popupBody").innerHTML = bodyHtml;
  window.currentSlideIndex[place.id] = 0;
  popupDom.style.display = "block";
  updatePopupPosition(place);
  setTimeout(()=>{
    refreshImageShow(place.id);
    setTimeout(()=>{
      refreshImageShow(place.id);
      if(window.autoSlideTimer){
        clearInterval(window.autoSlideTimer);
      }
      if(place.images.length > 1){
        window.autoSlideTimer = setInterval(()=>{
          slideImg(place.id, 1);
        },5000);
      }
    },30);
  },30);
}
window.closePopup = function(){
  if(window.autoSlideTimer){
    clearInterval(window.autoSlideTimer);
    window.autoSlideTimer = null;
  }
  const popupDom = document.querySelector('.my-info-popup');
  popupDom.style.display = "none";
  currentPlace = null;
}
function refreshImageShow(placeId){
  const allImgs = document.querySelectorAll(`.img-${placeId}-item`);
  const currentIdx = window.currentSlideIndex[placeId];
  allImgs.forEach(img=>{
    const idx = Number(img.dataset.idx);
    img.classList.toggle("show", idx === currentIdx);
  })
  const wrap = document.getElementById(`wrap-${placeId}`);
  if(!wrap) return;
  const dots = wrap.nextElementSibling.querySelectorAll(".dot");
  dots.forEach((dot,i)=>{
    dot.classList.toggle("active", i === currentIdx);
  })
}
window.slideImg = function(placeId, step){
  const place = placeData.find(p=>p.id === placeId);
  const imgList = place.images;
  let idx = window.currentSlideIndex[placeId] + step;
  if(idx <0) idx = imgList.length -1;
  if(idx >= imgList.length) idx = 0;
  window.currentSlideIndex[placeId] = idx;
  refreshImageShow(placeId);
}
window.jumpImg = function(placeId, idx){
  window.currentSlideIndex[placeId] = idx;
  refreshImageShow(placeId);
}
function setActiveItem(id){
  document.querySelectorAll(".item").forEach(el=>{
    el.classList.toggle("active", el.dataset.id == id);
  })
}
function refreshAllDistance(){
  if(!userLngLat) return;
  try{
    if(!(userLngLat instanceof AMap.LngLat)){
      const lng = userLngLat.lng != null ? userLngLat.lng : userLngLat.longitude;
      const lat = userLngLat.lat != null ? userLngLat.lat : userLngLat.latitude;
      userLngLat = new AMap.LngLat(lng, lat);
    }
    placeData.forEach(p=>{
      const {lng,lat} = parseCoords(p.coords);
      const pLatLng = new AMap.LngLat(lng,lat);
      const dis = userLngLat.distance(pLatLng);
      placeDist[p.id] = dis;
      let text = dis < 1000 ? `${dis.toFixed(0)}米` : `${(dis/1000).toFixed(2)}公里`;
      const dom = document.querySelector(`.dist[data-id="${p.id}"]`);
      if(dom) dom.innerText = `距离：${text}`;
    })
    sortPlaceList();
  }catch(e){
    console.warn("刷新距离失败：", e);
  }
}
function sortPlaceList(){
  const listWrap = document.getElementById("placeList");
  if(!listWrap) return;
  const items = Array.from(listWrap.children);
  const getVal = function(el){
    const v = placeDist[el.dataset.id];
    return (v == null || isNaN(v)) ? Infinity : v;
  };
  items.sort(function(a, b){
    return getVal(a) - getVal(b);
  });
  items.forEach(function(el){
    listWrap.appendChild(el);
  });
}
initMap();

document.addEventListener('visibilitychange', async function () {
  if (document.visibilityState !== 'visible') return;
  await new Promise(resolve => setTimeout(resolve, 150));
  const mapDom = document.getElementById('map');
  if (!mapDom) return;
  const rect = mapDom.getBoundingClientRect();
  if (rect.height < 10 || rect.width < 10) {
    mapDom.style.width = '100%';
    mapDom.style.height = '100%';
    mapDom.style.minHeight = '300px';
  }
  if (!map) {
    initMap();
    return;
  }
  try {
    if (map._resetWebGL) map._resetWebGL();
    map.resize();
    const center = map.getCenter();
    if (center) {
      map.setZoom(map.getZoom());
      map.panTo(center);
    }
  } catch (e) {
    console.warn('地图恢复失败，尝试重建', e);
    initMap();
  }
});

window.addEventListener('pageshow', function () {
  setTimeout(() => {
    const mapDom = document.getElementById('map');
    if (mapDom) {
      const rect = mapDom.getBoundingClientRect();
      if (rect.height < 10 || rect.width < 10) {
        mapDom.style.width = '100%';
        mapDom.style.height = '100%';
        mapDom.style.minHeight = '300px';
      }
    }
    if (!map) {
      initMap();
      return;
    }
    try {
      if (map._resetWebGL) map._resetWebGL();
      map.resize();
    } catch (e) {
      console.warn('pageshow地图恢复失败', e);
    }
  }, 200);
});
</script>
